# FILE: api/rocom-vda5050-binding.yaml
asyncapi: 3.0.0
info:
  title: Rocom VDA 5050 Binding
  version: 0.1.0
  description: >
    Rocom healthcare profile binding on top of VDA 5050 standard topics.
    Extensions live exclusively on rocom/v0/ topics — standard VDA 5050
    messages are never modified.
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    name: Rocom Project
    email: specs@techhappens.eu
    url: https://rocom.org
  tags:
    - name: healthcare-robotics
      description: Healthcare robotics orchestration
    - name: orchestration
      description: Multi-agent task orchestration
    - name: vda5050
      description: VDA 5050 AGV protocol binding

servers:
  production:
    host: mosquitto:1883
    protocol: mqtt
    description: Mosquitto MQTT broker

channels:
  vda5050-factsheet:
    address: vda5050/factsheet
    description: Standard VDA 5050 factsheet — robot declares itself

  vda5050-state:
    address: vda5050/state/+/{serialNumber}
    description: Standard VDA 5050 state updates per robot

  vda5050-connection:
    address: vda5050/connection/+/{serialNumber}
    description: Connection state (online/offline)

  vda5050-order:
    address: vda5050/order/+/{serialNumber}
    description: Standard VDA 5050 order dispatch

  vda5050-instantActions:
    address: vda5050/instantActions/+/{serialNumber}
    description: >
      VDA 5050 instant actions — including cancelOrder.
      Per VDA 5050 2.1.0, order cancellation is sent as an
      instantAction with action: "cancelOrder" on the
      vda5050/instantActions/<serialNumber> topic.

  rocom-compliance-event:
    address: rocom/v0/compliance/event
    description: >
      Rocom extension — compliance events published on zone transitions.
      Correlates to the orchestrator audit trail via taskId and agentId.

  rocom-capability-declare:
    address: rocom/v0/capability/declare
    description: >
      Rocom extension — robot declares Rocom-profile capabilities
      beyond standard VDA 5050. Keys must match capability-registry.yaml.

  rocom-chain-of-custody-event:
    address: rocom/v0/chainOfCustody/event
    description: >
      Rocom extension — chain-of-custody handoff events for
      regulated transport (medication, samples).

operations:
  receiveFactsheet:
    action: receive
    channel:
      $ref: '#/channels/vda5050-factsheet'
    summary: Robot publishes its factsheet
    description: Robot declares itself by publishing a VDA 5050 factsheet message
    messages:
      - $ref: '#/components/messages/FactsheetMessage'

  receiveState:
    action: receive
    channel:
      $ref: '#/channels/vda5050-state'
    summary: Robot publishes state updates
    description: Robot publishes periodic state updates (position, battery, state)
    messages:
      - $ref: '#/components/messages/StateMessage'

  receiveConnection:
    action: receive
    channel:
      $ref: '#/channels/vda5050-connection'
    summary: Robot publishes connection state
    description: Robot publishes online/offline connection state
    messages:
      - $ref: '#/components/messages/ConnectionMessage'

  sendOrder:
    action: send
    channel:
      $ref: '#/channels/vda5050-order'
    summary: Gateway dispatches order to robot
    description: Orchestrator dispatches a navigation order to the robot
    messages:
      - $ref: '#/components/messages/OrderMessage'

  sendInstantActions:
    action: send
    channel:
      $ref: '#/channels/vda5050-instantActions'
    summary: Gateway sends instant actions (cancelOrder, etc.)
    description: >
      Orchestrator sends instant actions per VDA 5050 2.1.0.
      Payload is {"message": {"serialNumber": "...",
      "timestamp": "..."}, "actions": [{"action": "cancelOrder",
      "order": {"serialNumber": "<orderId>"}}]}.
    messages:
      - $ref: '#/components/messages/InstantActionsMessage'

  receiveComplianceEvent:
    action: receive
    channel:
      $ref: '#/channels/rocom-compliance-event'
    summary: Robot publishes compliance event on zone transition
    description: Robot publishes compliance event when entering or leaving a zone
    messages:
      - $ref: '#/components/messages/ComplianceEvent'

  receiveCapabilityDeclare:
    action: receive
    channel:
      $ref: '#/channels/rocom-capability-declare'
    summary: Robot declares Rocom-profile capabilities
    description: Robot declares capabilities beyond standard VDA 5050 factsheet
    messages:
      - $ref: '#/components/messages/CapabilityDeclaration'

  receiveChainOfCustodyEvent:
    action: receive
    channel:
      $ref: '#/channels/rocom-chain-of-custody-event'
    summary: Robot publishes chain-of-custody handoff event
    description: Robot publishes custody handoff events for regulated transport
    messages:
      - $ref: '#/components/messages/ChainOfCustodyEvent'

defaultContentType: application/json

components:
  messages:
    FactsheetMessage:
      payload:
        type: object
        required: [manufacturer, model, serialNumber, capabilities, version]
        properties:
          manufacturer:
            type: string
          model:
            type: string
          serialNumber:
            type: string
          capabilities:
            type: object
            additionalProperties: true
          version:
            type: object
            properties:
              vda5050:
                type: string
              manufacturer:
                type: string

    StateMessage:
      payload:
        type: object
        required: [position, battery, state, timestamp]
        properties:
          position:
            type: object
            properties:
              building:
                type: string
              floor:
                type: string
              node:
                type: string
          battery:
            type: number
            minimum: 0
            maximum: 100
          state:
            type: string
            enum: [IDLE, MOVING, WORKING, CHARGING, ERROR]
          timestamp:
            type: string
            format: date-time

    ConnectionMessage:
      payload:
        type: object
        required: [online]
        properties:
          online:
            type: boolean

    OrderMessage:
      payload:
        type: object
        required: [orderId, sequence, timestamp]
        properties:
          orderId:
            type: string
            description: Carries orchestrator allocation ID
          sequence:
            type: array
            items:
              $ref: '#/components/schemas/NavigationNode'
          timestamp:
            type: string
            format: date-time

    InstantActionsMessage:
      payload:
        type: object
        required: [message, actions]
        description: >
          VDA 5050 2.1.0 instantActions message structure.
          For order cancellation, the actions array contains
          {"action": "cancelOrder", "order": {"serialNumber": "<orderId>"}}.
        properties:
          message:
            type: object
            required: [serialNumber, timestamp]
            properties:
              serialNumber:
                type: string
                description: Robot serial number being addressed.
              timestamp:
                type: string
                format: date-time
          actions:
            type: array
            items:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [cancelOrder, stop, resume]
                order:
                  type: object
                  properties:
                    serialNumber:
                      type: string
                      description: Order ID to cancel.

    ComplianceEvent:
      payload:
        type: object
        required: [eventId, taskId, agentId, zone, eventType, complianceStatus, auditCorrelationId, timestamp]
        properties:
          eventId:
            type: string
            format: uuid
          taskId:
            type: string
            format: uuid
          agentId:
            type: string
            format: uuid
          zone:
            type: string
          eventType:
            type: string
            enum: [zone_entry, zone_exit, restricted_zone_check, chain_of_custody]
          complianceStatus:
            type: string
            enum: [passed, failed, exception]
            description: REQUIRED per Part 5 (P-2.2.4).
          auditCorrelationId:
            type: string
            format: uuid
            description: REQUIRED per Part 5 (P-2.2.2). Links to orchestrator AuditEvent.
          timestamp:
            type: string
            format: date-time

    CapabilityDeclaration:
      payload:
        type: object
        required: [serialNumber, capabilities]
        properties:
          serialNumber:
            type: string
          capabilities:
            type: array
            items:
              type: object
              required: [key, level, certified]
              properties:
                key:
                  type: string
                  description: Capability key from capability-registry.yaml
                level:
                  type: string
                  enum: [basic, intermediate, expert]
                certified:
                  type: boolean
                expirationDate:
                  type: string
                  format: date

    ChainOfCustodyEvent:
      payload:
        type: object
        required: [eventId, taskId, itemType, agentId, action, timestamp, auditCorrelationId]
        properties:
          eventId:
            type: string
            format: uuid
          taskId:
            type: string
            format: uuid
          itemType:
            type: string
            enum: [medication, sample, meal, waste, linen]
          agentId:
            type: string
            format: uuid
          action:
            type: string
            enum: [picked_up, in_transit, delivered, handed_off]
          custodySignature:
            type: string
            description: Cryptographic hash of custody state.
            required: false
          timestamp:
            type: string
            format: date-time
          auditCorrelationId:
            type: string
            format: uuid
            description: REQUIRED per Part 5. Links to orchestrator audit trail.

  schemas:
    NavigationNode:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [NODE, TASK]
        payload:
          type: object
          additionalProperties: true
