# Rocom — Part 3: Information Model
# Status: DRAFT 0.1 (2026-08-12) — Edition 2026a (draft)
# License: CC-BY 4.0 (see LICENSE-SPEC)
# Scope: Core data types referenced by Parts 4, 5, 6, 7.
#        Contracts and profiles MUST use these types verbatim.
#
# Correction proposals incorporated:
#   CP-007 — Agent Identity Model (issuer-agnostic, UDI-aligned)
#     Status: MERGED. See spec/cp-007-agent-identity.md
#   CP-008 — Resource Authority Model
